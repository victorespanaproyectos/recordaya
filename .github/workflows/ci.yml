name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Pruebas de integración y regresión: Supabase local con las migraciones de supabase/migrations.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Iniciar Supabase local
        run: |
          supabase init --force
          supabase start

      - name: Variables de la base de pruebas
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - run: npm test
